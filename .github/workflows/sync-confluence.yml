name: Confluence 행동목표 동기화

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    # ★ Node.js 24 강제 적용 (warning 해결)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

      - name: 저장소 체크아웃
        uses: actions/checkout@v4        # ← v3 → v4

      - name: Python 설치
        uses: actions/setup-python@v5    # ← v4 → v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests

      - name: Confluence 동기화
        env:
          CONFLUENCE_URL:     ${{ secrets.CONFLUENCE_URL }}
          CONFLUENCE_TOKEN:   ${{ secrets.CONFLUENCE_TOKEN }}
          CONFLUENCE_EMAIL:   ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_PAGE_ID: ${{ secrets.CONFLUENCE_PAGE_ID }}
        run: python3 confluence_sync.py

      - name: 변경사항 커밋
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add goals.json
          git diff --staged --quiet || git commit -m "🔄 Confluence 동기화 $(date +'%Y-%m-%d %H:%M')"
          git push
