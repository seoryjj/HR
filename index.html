<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 본부별 팀원 행동목표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F4F6F9;color:#1A2744;line-height:1.6;}
.page{max-width:900px;margin:0 auto;padding:0 1rem 4rem;}
/* 히어로 */
.hero{background:linear-gradient(135deg,#1A2744 0%,#0C447C 100%);padding:2.5rem 2rem 2rem;margin-bottom:2rem;border-radius:0 0 16px 16px;}
.hero h1{color:#fff;font-size:22px;font-weight:500;margin-bottom:6px;display:flex;align-items:center;gap:10px;}
.hero-sub{color:#85B7EB;font-size:13px;}
.hero-meta{display:flex;gap:10px;margin-top:1rem;flex-wrap:wrap;}
.badge-hero{background:rgba(255,255,255,0.12);color:#B5D4F4;font-size:11px;padding:4px 12px;border-radius:20px;border:0.5px solid rgba(255,255,255,0.2);display:inline-flex;align-items:center;gap:5px;}
/* 안내 */
.guide-bar{background:#EBF4FF;border:0.5px solid #B5D4F4;border-radius:10px;padding:10px 16px;margin-bottom:1.5rem;font-size:12px;color:#0C447C;display:flex;align-items:center;gap:8px;}
/* 로딩/에러 */
.status{text-align:center;padding:3rem;color:#9A9FAA;font-size:14px;}
/* 전사공통 */
.common-section{background:#1A2744;border-radius:12px;padding:1.25rem;margin-bottom:1.5rem;}
.common-hdr{display:flex;align-items:center;gap:10px;margin-bottom:1rem;}
.common-hdr-title{font-size:15px;font-weight:500;color:#fff;}
.common-hdr-sub{font-size:11px;color:#85B7EB;margin-top:2px;}
.common-goals{display:flex;flex-direction:column;gap:6px;}
.common-goal{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;background:rgba(255,255,255,0.08);border:0.5px solid rgba(133,183,235,0.25);border-radius:8px;font-size:13px;color:#E8F4FF;line-height:1.55;cursor:pointer;transition:background .1s;}
.common-goal:hover{background:rgba(255,255,255,0.15);}
.common-goal-text{flex:1;}
.copy-icon{font-size:14px;color:#85B7EB;flex-shrink:0;opacity:0.5;transition:opacity .1s;}
.common-goal:hover .copy-icon{opacity:1;}
/* 요약 */
.summary-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem;}
.sum-card{background:#fff;border-radius:10px;border:0.5px solid #E2E6EE;padding:14px;text-align:center;}
.sum-num{font-size:24px;font-weight:500;color:#185FA5;}
.sum-lbl{font-size:11px;color:#9A9FAA;margin-top:2px;}
/* 필터 */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem;align-items:center;}
.filter-label{font-size:11px;color:#9A9FAA;display:flex;align-items:center;gap:3px;margin-right:2px;}
.filter-btn{font-size:12px;padding:6px 14px;border-radius:20px;border:0.5px solid #D0D5DE;background:#fff;color:#5A6070;cursor:pointer;transition:all .15s;}
.filter-btn:hover{background:#E6F1FB;color:#185FA5;border-color:#185FA5;}
.filter-btn.active{background:#185FA5;color:#fff;border-color:#185FA5;}
/* 본부 카드 */
.dept-section{background:#fff;border:0.5px solid #E2E6EE;border-radius:12px;padding:1.25rem;margin-bottom:1.25rem;}
.dept-section.dual-dept{border-color:#B5D4F4;border-width:1px;}
.dept-hdr{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;padding-bottom:12px;border-bottom:1px solid #EEF0F5;}
.dept-avatar{width:44px;height:44px;border-radius:10px;background:#E6F1FB;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;color:#185FA5;flex-shrink:0;}
.dept-avatar.dual{background:#FAEEDA;color:#633806;}
.dept-name{font-size:16px;font-weight:500;color:#1A2744;}
.dept-head-info{font-size:12px;color:#9A9FAA;margin-top:3px;display:flex;align-items:center;gap:6px;}
.dept-count{margin-left:auto;background:#F4F6F9;color:#5A6070;font-size:11px;padding:4px 12px;border-radius:20px;border:0.5px solid #E2E6EE;white-space:nowrap;}
.dual-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:500;padding:2px 8px;border-radius:10px;background:#FAEEDA;color:#633806;border:0.5px solid #FAC775;margin-left:6px;vertical-align:middle;}
/* 역할 그룹 */
.role-group{margin-bottom:1rem;}
.role-group:last-child{margin-bottom:0;}
.role-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.role-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:4px 12px;border-radius:20px;}
/* 역할별 색상 */
.rt-연구개발,.rt-팀장{background:#EAF3DE;color:#27500A;}
.rt-업무자세{background:#F3E8FF;color:#4A1228;}
.rt-영업,.rt-팀원,.rt-팀원공통,.rt-팀공통{background:#E6F1FB;color:#0C447C;}
.rt-PM{background:#FAEEDA;color:#633806;}
.rt-PL{background:#F3E8FF;color:#4A1228;}
.rt-개발자{background:#FCEBEB;color:#791F1F;}
.rt-실장,.rt-사업부서팀원{background:#F1EFE8;color:#444441;}
.rt-default{background:#F4F6F9;color:#5A6070;}
.btn-copy-role{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:4px 10px;border-radius:16px;border:0.5px solid #D0D5DE;background:#fff;color:#5A6070;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-copy-role:hover{background:#E6F1FB;color:#185FA5;border-color:#185FA5;}
/* 목표 항목 */
.goal-list{display:flex;flex-direction:column;gap:6px;}
.goal-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#FAFBFC;border:0.5px solid #EEF0F5;border-radius:8px;font-size:13px;line-height:1.6;color:#1A2744;cursor:pointer;transition:background .1s,border-color .1s;}
.goal-item:hover{background:#EBF4FF;border-color:#B5D4F4;}
.goal-item:hover .copy-hint{opacity:1;}
.goal-num{font-size:11px;color:#9A9FAA;min-width:18px;padding-top:1px;font-weight:500;flex-shrink:0;}
.goal-text{flex:1;}
.copy-hint{font-size:11px;color:#185FA5;opacity:0;transition:opacity .15s;flex-shrink:0;display:flex;align-items:center;gap:3px;white-space:nowrap;}
/* 공지 박스 */
.notice-box{padding:12px 14px;background:#FEF9F0;border:0.5px solid #FAC775;border-radius:8px;font-size:13px;color:#633806;display:flex;align-items:center;gap:8px;}
/* 토스트 */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1A2744;color:#fff;font-size:13px;padding:10px 20px;border-radius:24px;opacity:0;transition:all .25s;pointer-events:none;z-index:9999;display:flex;align-items:center;gap:6px;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.hidden{display:none!important;}
.footer{text-align:center;padding:2rem 0 1rem;color:#9A9FAA;font-size:12px;}
@media(max-width:600px){.summary-bar{grid-template-columns:repeat(3,1fr);}.hero{padding:1.5rem 1rem 1.25rem;border-radius:0;}.dept-section{border-radius:8px;padding:1rem;}}
@media print{.filter-bar,.guide-bar,.copy-hint,.btn-copy-role,.toast{display:none;}.hero{border-radius:0;}.dept-section{break-inside:avoid;}}
</style>
</head>
<body>
<div class="page">
  <div id="app"><div class="status"><i class="ti ti-loader" style="font-size:24px;animation:spin 1s linear infinite"></i><br><br>데이터를 불러오는 중...</div></div>
</div>
<div class="toast" id="toast"><i class="ti ti-check"></i> <span id="toast-msg"></span></div>

<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<script>
// ── 역할명 → CSS 클래스 매핑 ────────────────────
function roleClass(name) {
  const map = {
    '연구개발':'연구개발','업무자세':'업무자세',
    '영업':'영업','팀장':'팀장','팀원':'팀원',
    '팀원 공통':'팀원공통','팀 공통':'팀공통',
    'PM':'PM','PL':'PL','개발자':'개발자',
    '실장·팀장':'실장','사업부서 팀원':'사업부서팀원',
    '팀장·PM':'팀장'
  };
  return 'rt-' + (map[name] || 'default');
}

// ── 역할명 → 아이콘 ─────────────────────────────
function roleIcon(name) {
  const map = {
    '연구개발':'ti-flask','업무자세':'ti-mood-smile',
    '영업':'ti-users','팀장':'ti-crown','팀원':'ti-user',
    '팀원 공통':'ti-users','팀 공통':'ti-users',
    'PM':'ti-chart-gantt','PL':'ti-code','개발자':'ti-terminal',
    '실장·팀장':'ti-briefcase','사업부서 팀원':'ti-user',
    '팀장·PM':'ti-crown'
  };
  return map[name] || 'ti-list';
}

// ── 복사 기능 ────────────────────────────────────
function copyText(text, el) {
  navigator.clipboard.writeText(text).then(() => showToast(text))
    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); showToast(text);
    });
  if (el) {
    const orig = el.style.background;
    el.style.background = '#D4EDDA'; el.style.borderColor = '#27AE60';
    setTimeout(() => { el.style.background = ''; el.style.borderColor = ''; }, 700);
  }
}
function copyGoal(el) {
  copyText(el.querySelector('.goal-text').innerText, el);
}
function copyRole(btn) {
  const grp = btn.closest('.role-group');
  const role = grp.querySelector('.role-tag').innerText.trim();
  const lines = [...grp.querySelectorAll('.goal-text')]
    .map((el, i) => (i+1) + '. ' + el.innerText);
  copyText('[' + role + ']\n' + lines.join('\n'), null);
}
function showToast(text) {
  const msg = text.length > 25 ? text.slice(0,25) + '…' : text;
  document.getElementById('toast-msg').innerText = '"' + msg + '" 복사됨';
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2000);
}

// ── 필터 ────────────────────────────────────────
function filterDept(key, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.dept-section').forEach(s => {
    s.classList.toggle('hidden', key !== 'all' && !s.dataset.dept.includes(key));
  });
}

// ── 렌더링 ───────────────────────────────────────
function render(data) {
  const { meta, common, depts } = data;
  const totalGoals = depts.reduce((s, d) => s + d.roles.reduce((r, g) => r + g.goals.length, 0), 0) + common.goals.length;

  let html = `
  <div class="hero">
    <h1><i class="ti ti-target"></i> ${meta.title}</h1>
    <p class="hero-sub">${meta.subtitle} · 작성: ${meta.author}</p>
    <div class="hero-meta">
      <span class="badge-hero"><i class="ti ti-list-check"></i> 전사 공통 5대 키워드</span>
      <span class="badge-hero"><i class="ti ti-building"></i> ${depts.length}개 본부</span>
      <span class="badge-hero"><i class="ti ti-users"></i> 전 구성원</span>
    </div>
  </div>

  <div class="guide-bar">
    <i class="ti ti-bulb" style="font-size:16px;flex-shrink:0"></i>
    <span><b>목표 항목을 클릭</b>하면 해당 문장이 복사됩니다. 역할 옆 <b>'전체 복사'</b> 버튼을 누르면 해당 역할의 목표가 번호와 함께 복사됩니다.</span>
  </div>

  <div class="common-section">
    <div class="common-hdr">
      <i class="ti ti-star" style="font-size:22px;color:#85B7EB"></i>
      <div>
        <div class="common-hdr-title">${common.title}</div>
        <div class="common-hdr-sub">${common.subtitle} · 클릭하면 복사됩니다</div>
      </div>
    </div>
    <div class="common-goals">
      ${common.goals.map(g => `
      <div class="common-goal" onclick="copyText('${g.replace(/'/g,"\\'")}',this)">
        <span class="common-goal-text">${g}</span>
        <i class="ti ti-copy copy-icon"></i>
      </div>`).join('')}
    </div>
  </div>

  <div class="summary-bar">
    <div class="sum-card"><div class="sum-num">${depts.length}</div><div class="sum-lbl">본부</div></div>
    <div class="sum-card"><div class="sum-num">${[...new Set(depts.map(d=>d.head))].length}</div><div class="sum-lbl">본부장</div></div>
    <div class="sum-card"><div class="sum-num">${totalGoals}</div><div class="sum-lbl">전체 목표</div></div>
  </div>

  <div class="filter-bar">
    <span class="filter-label"><i class="ti ti-filter" style="font-size:13px"></i> 본부</span>
    <button class="filter-btn active" onclick="filterDept('all',this)">전체</button>
    ${depts.map(d => `<button class="filter-btn" onclick="filterDept('${d.id}',this)">${d.name.replace(' AI 사업본부','').replace('본부','').trim()}</button>`).join('')}
  </div>

  <div id="dept-list">
  ${depts.map(d => {
    const totalDeptGoals = d.roles.reduce((s,r) => s + r.goals.length, 0);
    const avatarChar = d.name.slice(0,1);
    const dualBadge = d.dual ? `<span class="dual-badge"><i class="ti ti-stack-2" style="font-size:11px"></i> ${d.dual_label}</span>` : '';
    const dualNote = d.dual ? `<span style="color:#B5D4F4;font-size:10px;">· ${d.dual_note}</span>` : '';

    const rolesHtml = d.notice
      ? `<div class="notice-box"><i class="ti ti-info-circle" style="font-size:16px;flex-shrink:0"></i>${d.notice}</div>`
      : d.roles.map(r => `
      <div class="role-group">
        <div class="role-hdr">
          <div class="role-tag ${roleClass(r.name)}"><i class="ti ${roleIcon(r.name)}"></i> ${r.name}</div>
          <button class="btn-copy-role" onclick="copyRole(this)"><i class="ti ti-clipboard"></i> 전체 복사</button>
        </div>
        <div class="goal-list">
          ${r.goals.map((g,i) => `
          <div class="goal-item" onclick="copyGoal(this)">
            <span class="goal-num">${i+1}</span>
            <span class="goal-text">${g}</span>
            <span class="copy-hint"><i class="ti ti-copy"></i>복사</span>
          </div>`).join('')}
        </div>
      </div>`).join('');

    return `
    <div class="dept-section${d.dual?' dual-dept':''}" data-dept="${d.id}">
      <div class="dept-hdr">
        <div class="dept-avatar${d.dual?' dual':''}">${avatarChar}</div>
        <div>
          <div class="dept-name">${d.name}${dualBadge}</div>
          <div class="dept-head-info">
            <i class="ti ti-user-circle" style="font-size:13px"></i>
            ${d.head} 본부장 ${dualNote}
          </div>
        </div>
        ${totalDeptGoals > 0 ? `<span class="dept-count">${totalDeptGoals}개 목표</span>` : ''}
      </div>
      ${rolesHtml}
    </div>`;
  }).join('')}
  </div>

  <div class="footer">${meta.title} · ${meta.updated} · 작성: ${meta.author}</div>`;

  document.getElementById('app').innerHTML = html;
}

// ── goals.json 로드 ──────────────────────────────
fetch('./goals.json')
  .then(r => {
    if (!r.ok) throw new Error('goals.json 파일을 찾을 수 없습니다.');
    return r.json();
  })
  .then(data => render(data))
  .catch(err => {
    document.getElementById('app').innerHTML = `
      <div class="status">
        <i class="ti ti-alert-circle" style="font-size:32px;color:#A32D2D"></i><br><br>
        <b>데이터를 불러오지 못했습니다</b><br>
        <span style="font-size:12px;color:#9A9FAA;margin-top:8px;display:block">
          ${err.message}<br><br>
          index.html 과 같은 폴더에 <b>goals.json</b> 파일이 있는지 확인하세요.<br>
          로컬에서 열 경우 브라우저 보안 정책으로 인해 서버 환경이 필요합니다.
        </span>
      </div>`;
  });
</script>
</body>
</html>
